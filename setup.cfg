[metadata]
name = bulkhours
version = attr:bulkhours.__version__.__version__
long_description = file: README.md
classifiers =
    Framework :: Jupyter
    Programming Language :: Python :: 3
    License :: Other/Proprietary License
    Operating System :: OS Independent

[options]
packages = find:
# The course standard's renderer, this repository's own copy (packages/course_manager):
# cell_parser delegates to it. A direct reference, as bulkhours itself installs from git.
install_requires =
    pandas
    course-manager @ git+https://github.com/gtherin/bulkhours@course-manager/0.3.0#subdirectory=packages/course_manager
recommended_python = 3.11

[options.entry_points]
console_scripts =
    bulkhours-correct = bulkhours.core.evaluation:dump_corrections
    bulkhours-boids = bulkhours.bots.boids.simulation:main
    bulkhours-git-push = bulkhours.core:git_push
    bulkhours-strava = bulkhours.sport.strava:preprocess
