[metadata]
name = bulkhours
version = attr:bulkhours.__version__.__version__
long_description = file: README.md
classifiers =
    Framework :: Jupyter
    Programming Language :: Python :: 3
    License :: Other/Proprietary License
    Operating System :: OS Independent

[options]
packages = find:
# The course standard's renderer: the coursemanager project (GatekaC/coursemanager),
# pinned by tag until its PyPI release, then `coursemanager==1.0.0`.
install_requires =
    pandas
    coursemanager @ git+https://github.com/GatekaC/coursemanager@v1.0.0
recommended_python = 3.11

[options.entry_points]
console_scripts =
    bulkhours-correct = bulkhours.core.evaluation:dump_corrections
    bulkhours-boids = bulkhours.bots.boids.simulation:main
    bulkhours-git-push = bulkhours.core:git_push
    bulkhours-strava = bulkhours.sport.strava:preprocess
