[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bulkhours-course"
version = "0.3.0"
description = "The course standard: course.toml, one source per lab, student and teacher versions, waves and their record"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []          # jupytext only for .py notebooks: COURSE_JUPYTEXT or on PATH

[project.scripts]
bulkhours-course = "bulkhours_course.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
